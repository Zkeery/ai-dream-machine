<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">AI造梦机系统架构概览</title><desc id="desc">本地 Next.js 前端与 FastAPI 后端两个进程。六阶段和三工具位于同一后端。SQLite 保存执行、进度事件与版本元数据，断线重新订阅，重启后未完成执行标记中断。统一作品展示与素材复用已接入，外部模型真实效果尚未验收。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1L8 5L0 9" fill="none" stroke="#64748b" stroke-width="1.5"/></marker><marker id="target" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1L8 5L0 9" fill="none" stroke="#6486ad" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#263345}.title{font-size:28px;font-weight:650}.sub{font-size:18px;fill:#6b7280}.label{font-size:22px;font-weight:600}.body{font-size:18px;fill:#536173}.note{font-size:16px;fill:#52749c}.box{fill:#fff;stroke:#cbd3df;stroke-width:2}.integrated{fill:#eff6ff;stroke:#7495bd;stroke-width:2}.line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.connected{fill:none;stroke:#6486ad;stroke-width:2;marker-end:url(#target)}</style>
<rect width="1200" height="900" rx="18" fill="#f8fafc"/>
<text x="40" y="43" class="title">02 / 系统架构概览</text><text x="40" y="75" class="sub">当前两个本地进程；蓝框为本轮已接入职责，不代表新增独立服务。</text>
<rect x="60" y="105" width="1080" height="144" rx="14" fill="#eef2f7" stroke="#cbd3df" stroke-width="2"/><text x="85" y="140" class="label">前端 · Next.js / React / TypeScript · 3030</text>
<rect x="85" y="168" width="180" height="54" rx="8" class="box"/><text x="175" y="202" text-anchor="middle" class="body">创作台</text>
<rect x="294" y="168" width="180" height="54" rx="8" class="box"/><text x="384" y="202" text-anchor="middle" class="body">故事工作区</text>
<rect x="503" y="168" width="180" height="54" rx="8" class="box"/><text x="593" y="202" text-anchor="middle" class="body">快捷工具</text>
<rect x="712" y="168" width="180" height="54" rx="8" class="integrated"/><text x="802" y="202" text-anchor="middle" class="body">统一作品库</text>
<rect x="921" y="168" width="194" height="54" rx="8" class="integrated"/><text x="1018" y="202" text-anchor="middle" class="body">任务进度与恢复</text>
<path d="M600 249V315" class="line"/><text x="628" y="288" class="sub">API 请求 / 进度订阅</text>
<rect x="60" y="315" width="1080" height="293" rx="14" fill="#f0f5fa" stroke="#bdccdd" stroke-width="2"/><text x="85" y="352" class="label">后端 · FastAPI / Pydantic · 8030</text><text x="1115" y="352" text-anchor="end" class="sub">同一 Python 服务</text>
<rect x="85" y="375" width="1030" height="52" rx="8" class="box"/><text x="600" y="408" text-anchor="middle" class="body">API / 邀请码与账号归属校验 / 上传 / 媒体访问与导出</text>
<path d="M280 427V464" class="line"/><path d="M640 427V464" class="line"/><path d="M964 427V464" class="connected"/>
<rect x="85" y="464" width="335" height="110" rx="10" class="box"/><text x="252" y="500" text-anchor="middle" class="label">六阶段故事编排</text><text x="252" y="532" text-anchor="middle" class="body">Orchestrator / sessions</text><text x="252" y="558" text-anchor="middle" class="sub">后台执行 / 独立进度订阅</text>
<rect x="445" y="464" width="335" height="110" rx="10" class="box"/><text x="612" y="500" text-anchor="middle" class="label">三种快捷工具编排</text><text x="612" y="532" text-anchor="middle" class="body">ShortPipelines / tasks</text><text x="612" y="558" text-anchor="middle" class="sub">持久状态 / 可恢复订阅</text>
<rect x="805" y="464" width="310" height="110" rx="10" class="integrated"/><text x="960" y="500" text-anchor="middle" class="label">统一任务与版本管理</text><text x="960" y="532" text-anchor="middle" class="body">输入快照 / 状态恢复 / 归属</text><text x="960" y="558" text-anchor="middle" class="note">已接入代码</text>
<path d="M600 608V638H230V672" class="line"/><path d="M600 608V672" class="line"/><path d="M600 608V638H970V672" class="line"/>
<rect x="60" y="672" width="340" height="164" rx="12" class="box"/><text x="84" y="706" class="label">数据与文件持久化</text><text x="84" y="735" class="body">SQLite · data/app.db</text><text x="84" y="761" class="body">账号 / 会话 / 任务 / 执行事件</text><text x="84" y="787" class="body">本地文件：素材 / 片段 / 成片</text><text x="84" y="817" class="note">版本引用与选版已接入</text>
<rect x="430" y="672" width="340" height="164" rx="12" class="box"/><text x="454" y="706" class="label">外部模型与配音服务</text><text x="454" y="741" class="body">AIHubMix：剧本 / 图像 / 视频</text><text x="454" y="776" class="body">Edge TTS：独立远端配音</text><text x="454" y="811" class="sub">图片参考已接入 · 效果待验收</text>
<rect x="800" y="672" width="340" height="164" rx="12" class="box"/><text x="824" y="706" class="label">后端本地媒体处理</text><text x="824" y="741" class="body">FFmpeg：提取 / 拼接 / 合成</text><text x="824" y="776" class="body">媒体文件读取与生成</text><text x="824" y="811" class="sub">本地子进程执行</text>
<text x="60" y="872" class="sub">SQLite 保存执行与事件；SSE 断线可恢复；重启后未完成任务标记中断。真实模型效果待验收。</text>
</svg>
