<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">AI造梦机产品模块关系</title>
<desc id="desc">创作台进入故事工作区或快捷工具。统一作品展示、素材复用、草稿与生成任务恢复已经接入代码，两类创作可归档并继续创作。蓝色表示本轮接入关系，不代表真实付费模型效果已验收。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1L8 5L0 9" fill="none" stroke="#64748b" stroke-width="1.5"/></marker><marker id="target" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1L8 5L0 9" fill="none" stroke="#6486ad" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#263345}.title{font-size:28px;font-weight:650}.sub{font-size:18px;fill:#6b7280}.label{font-size:23px;font-weight:600}.body{font-size:19px;fill:#536173}.note{font-size:17px;fill:#52749c}.box{fill:#fff;stroke:#cbd3df;stroke-width:2}.integrated{fill:#eff6ff;stroke:#7495bd;stroke-width:2}.line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.connected{fill:none;stroke:#6486ad;stroke-width:2;marker-end:url(#target)}</style>
<rect width="1200" height="720" rx="18" fill="#f8fafc"/>
<text x="40" y="43" class="title">01 / 产品模块关系</text><text x="40" y="75" class="sub">统一作品库、素材复用、草稿和任务恢复已接入；真实生成效果待验收。</text>
<rect x="430" y="106" width="340" height="84" rx="12" class="box"/><text x="600" y="140" text-anchor="middle" class="label">创作台</text><text x="600" y="171" text-anchor="middle" class="body">新建 · 继续项目 · 灵感示例</text>
<path d="M600 190V212H300V242" class="line"/><path d="M600 190V212H900V242" class="line"/>
<rect x="100" y="242" width="400" height="110" rx="12" class="box"/><text x="300" y="279" text-anchor="middle" class="label">故事工作区</text><text x="300" y="311" text-anchor="middle" class="body">六阶段 · 用户确认 · 查看与生成</text><text x="300" y="335" text-anchor="middle" class="sub">现有故事会话</text>
<rect x="700" y="242" width="400" height="110" rx="12" class="box"/><text x="900" y="279" text-anchor="middle" class="label">快捷短片工具</text><text x="900" y="311" text-anchor="middle" class="body">文艺短片 · 动作创作 · 口播</text><text x="900" y="335" text-anchor="middle" class="sub">现有独立任务</text>
<path d="M300 352V396" class="connected"/><path d="M900 352V396" class="connected"/>
<rect x="80" y="396" width="1040" height="142" rx="14" class="integrated"/><text x="105" y="429" class="label">统一创作管理</text><text x="1095" y="429" text-anchor="end" class="note">已接入：两类记录统一展示</text>
<rect x="105" y="451" width="310" height="60" rx="9" fill="#fff" stroke="#cddced"/><text x="260" y="477" text-anchor="middle" class="body">项目与草稿</text><text x="260" y="501" text-anchor="middle" class="sub">归属 · 创意 · 参数</text>
<rect x="445" y="451" width="310" height="60" rx="9" fill="#fff" stroke="#cddced"/><text x="600" y="477" text-anchor="middle" class="body">素材与版本</text><text x="600" y="501" text-anchor="middle" class="sub">来源 · 选版 · 依赖</text>
<rect x="785" y="451" width="310" height="60" rx="9" fill="#fff" stroke="#cddced"/><text x="940" y="477" text-anchor="middle" class="body">生成任务与进度</text><text x="940" y="501" text-anchor="middle" class="sub">执行 · 恢复 · 结果</text>
<path d="M600 538V574" class="connected"/><rect x="400" y="574" width="400" height="80" rx="12" class="integrated"/><text x="600" y="607" text-anchor="middle" class="label">我的作品 · 统一作品库</text><text x="600" y="636" text-anchor="middle" class="body">项目 / 素材 / 成片 · 预览与导出</text>
<path d="M400 614H45V297H100" class="connected"/><path d="M800 614H1155V297H1100" class="connected"/>
<text x="188" y="589" class="note">复用素材 / 继续创作</text><text x="822" y="589" class="note">复用素材 / 继续创作</text>
<path d="M45 692H83" stroke="#64748b" stroke-width="2"/><text x="94" y="698" class="sub">已有页面 / 流程</text><path d="M315 692H353" stroke="#6486ad" stroke-width="2"/><text x="364" y="698" class="sub">本轮已接入的关系</text><text x="1155" y="698" text-anchor="end" class="sub">设置 / 沙盒为辅助入口</text>
</svg>
