<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">AI造梦机创作数据与版本依赖</title><desc id="desc">剧本生成角色图和分镜，分镜生成参考图，参考图与分镜生成视频，视频拼接成片。选定角色与场景图片已经进入参考图及参考模式视频请求；输入版本可追溯，上游编辑与选版会标记受影响下游失效。真实模型一致性效果尚未验收。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1L8 5L0 9" fill="none" stroke="#64748b" stroke-width="1.5"/></marker><marker id="target" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1L8 5L0 9" fill="none" stroke="#6486ad" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#263345}.title{font-size:28px;font-weight:650}.sub{font-size:18px;fill:#6b7280}.label{font-size:21px;font-weight:600}.body{font-size:18px;fill:#536173}.note{font-size:17px;fill:#52749c}.box{fill:#fff;stroke:#cbd3df;stroke-width:2}.integrated{fill:#eff6ff;stroke:#7495bd;stroke-width:2}.line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.connected{fill:none;stroke:#6486ad;stroke-width:2;marker-end:url(#target)}</style>
<rect width="1200" height="680" rx="18" fill="#f8fafc"/>
