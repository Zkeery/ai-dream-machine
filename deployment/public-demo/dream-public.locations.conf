# Include in the shared HTTP/HTTPS server; only /dream belongs to this file.
location = /dream { return 302 /dream/; }
location ^~ /dream/api/ {
    proxy_pass http://127.0.0.1:8130/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_cache off;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location ^~ /dream/_next/static/ {
    alias /opt/dream-public/current/frontend/.next-public-demo/static/;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location = /dream/ {
    proxy_pass http://127.0.0.1:3130;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
}
location ^~ /dream/ {
    default_type application/json;
    return 404 '{"message":"该示例暂未开放"}';
}
